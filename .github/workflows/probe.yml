name: probe
on:
  push:
    branches: [claude/probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: mkdir -p probe_out && python probe/probe.py | tee probe_out/summary.txt || true
      - name: push results to claude/probe-out
        run: |
          mkdir -p probe_out
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan claude/probe-out
          git rm -rq --cached . 
          git add -f probe_out
          git commit -qm "probe results"
          git push -f origin claude/probe-out
